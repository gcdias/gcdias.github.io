<!DOCTYPE html>
<html lang="en">
<head>
  <title>Ubuntu-Setup</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="res/html/style.css">
</head>
<body allow="local-fonts">
  <div class="div-header">Machine</div>
    <details open>
    <summary>Vendor</summary>
      
        <div class="flex-1">
          <label for="vendor">Vendor</label>
          <select id="vendor">
          </select>
        </div>
        <div class="flex-1">
          <label for="res">Screen Res</label>
          <select id="res">
          </select>
        </div>
      <div class="flex-end">
        <div class="flex-1">
          <label for="os">OS</label>
          <select id="os">
          </select>
        </div>
        <div class="flex-1">
          <label for="osv">Version</label>
          <input type="text" id="osv" value=""/>
        </div>
      </div>  
    </details>
  </div>
  <script type="text/javascript" src="main.js"></script>
</body>
</html>
