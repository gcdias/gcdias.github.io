<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 183 119">
<defs>
 <style>
  :root {
    --view-bg-color: #fdfdfd;
    --sidebar-fg-color: #333333;
    --headerbar-bg-color: #e0e0e0;
    --headerbar-fg-color: #333333;
    --popover-bg-color: #ffffff;
    --popover-fg-color: #333333;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --view-bg-color: #2e3436;
      --sidebar-fg-color: #eeeeec;
      --headerbar-bg-color: #555753;
      --headerbar-fg-color: #eeeeec;
      --popover-bg-color: #2e3436;
      --popover-fg-color: #eeeeec;
    }
  }
  .view-bg { fill: var(--view-bg-color); }
  .side-fg { fill: var(--sidebar-fg-color); }
  .header-bg { fill: var(--headerbar-bg-color); }
  .header-fg { fill: var(--headerbar-fg-color); }
  .pop-bg { fill: var(--popover-bg-color); }
  .pop-fg { fill: var(--popover-fg-color); stroke: var(--popover-fg-color);}
 </style>
</defs>
