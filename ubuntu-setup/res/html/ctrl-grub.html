<div class="control-group">
  <div class="div-header">Grub</div>
  <details>
    <summary>OS Menu</summary>
    <div class="flex-end">
      <div class="flex-1">
        <label for="os_color">Color:</label>
        <input type="color" id="os_color" value="#FFFFFF" />
      </div>
      <div class="flex-1">
        <label for="grub_itemcolor">Unselected Color:</label>
        <input type="color" id="grub_itemcolor" value="#FFFFFF" />
      </div>
      <div class="flex-1">
        <label for="os_size">Size:</label>
        <input type="number" id="os_size" min="18" max="128" step="4" value="72"/>
      </div>
      <div class="flex-switch">
        <span class="span-label">Render Captions</span>
        <label class="material-switch">
          <input type="checkbox" id="grub_rendercap" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="flex-end">
      <div class="flex-1">
        <label for="grub_menu_x">x%:</label>
        <input type="number" id="grub_menu_x" min="5" max="80" step="5" value="5"/>
      </div>
      <div class="flex-1">
        <label for="grub_menu_y">y%:</label>
        <input type="number" id="grub_menu_y" min="5" max="90" step="5" value="30"/>
      </div>
      <div class="flex-1">
        <label for="grub_menu_w">width%:</label>
        <input type="number" id="grub_menu_w" min="5" max="90" step="5" value="30"/>
      </div>
      <div class="flex-1">
        <label for="grub_menu_h">height%:</label>
        <input type="number" id="grub_menu_h" min="5" max="90" step="5" value="40"/>
      </div>
    </div>
    <div class="flex-end">
      <div class="flex-1">
        <label for="grub_padding">Item Padding:</label>
        <input type="number" id="grub_padding" min="0" max="72" step="2" value="8"/>
      </div>
      <div class="flex-1">
        <label for="grub_iconspace">Icon Spacing:</label>
        <input type="number" id="grub_iconspace" min="0" max="72" step="2" value="16"/>
      </div>
      <div class="flex-1">
        <label for="grub_spacing">Item Spacing:</label>
        <input type="number" id="grub_spacing" min="0" max="72" step="2" value="8"/>
      </div>
  </details>
</div>
