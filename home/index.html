<script id="shader1" type="x-shader/x-fragment">
  uniform vec2  iResolution;
  uniform float iTime;

  void mainImage( out vec4 fragColor, in vec2 fragCoord ){
    vec2 uv = fragCoord/iResolution.xy;
    vec3 col =  0.9 + 0.1 * cos(iTime + uv.yxx * uv.xyy * vec3(3,4,5));
    vec3 dst = mix(col, col.xxx, abs(cos(iTime * 0.1)));
    fragColor = vec4(dst,1.0);
  }
</script>
<script id="shader2" type="x-shader/x-fragment">
  uniform vec2  iResolution;
  uniform float iTime;
  #define OCTAVES 8
  #define LAYERS  5
  #define ROT(r)  mat2(cos(r), sin(r), -sin(r), cos(r))
  #define BKG     vec3(0.1,0.26,0.57)
  #define I       vec2(0.0, 1.0)
  #define zoom    1.0

  float R12(vec2 st) {
    return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
  }

  float N12(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(R12(i       ), R12(i + I.yx), f.x),
      mix(R12(i + I.xy), R12(i + I.yy), f.x),
      f.y);
  }

  float FBM12 (in vec2 u, float i, float o) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < OCTAVES; i++) {
        v += a * N12(u);
        u *= 2.2;
        a *= 0.42;
      }
      return smoothstep(i,o,v);
  }

  void mainImage( out vec4 fragColor, in vec2 fragCoord ){
      
      vec2 uv = fragCoord/iResolution.xy * vec2(iResolution.x/iResolution.y, 1.0);
      vec3 col = BKG;
      vec2 DIR = vec2(0.001, -0.02);
      vec2 p = zoom * uv * ROT(0.01 * iTime) + iTime * DIR;
      float f = 0.0;
      float c1 = 0.2 + 0.1 * sin(iTime * 0.1);
      float c2 = c1 + 0.5 + 0.2 * cos(iTime * 0.03);
      
      for (int i = 0 ; i < LAYERS; i++){
          //f += FBM12(uv * ROT(0.01 * iTime) + (f + iTime) * DIR, cloudiness, 1.0);
          f += FBM12(p + f * DIR, c1, c2);
          DIR *= 0.3;
      }
      
      f = (1.5 + c1) * f / max(float(LAYERS), 1.0);
      
      float s = smoothstep(0.5, 1.1, f);
      vec3 shade = 1.0 - BKG;
      col = mix(mix(col, col + min(f, 0.5) * (1. - col), f), vec3(0.9 - smoothstep(1.0, 2.4, f) * shade), s);
      

      fragColor = vec4(col, 1.0);
  }
</script>
<script id="shader3" type="x-shader/x-fragment">
uniform vec2  iResolution;
uniform float iTime;

// https://www.shadertoy.com/view/Msl3WH
// 'Warp Speed' by David Hoskins 2013.
// I tried to find gaps and variation in the star cloud for a feeling of structure.
// Inspired by Kali: https://www.shadertoy.com/view/ltl3WS

void mainImage( out vec4 fragColor, in vec2 fragCoord ){
  float time = (iTime + 1.) * 60.0;
  float s = 0.0, v = 0.0;
  vec2 uv = (-iResolution.xy + 2.0 * fragCoord ) / iResolution.y;
	float t = time * 0.0001;
	uv.x += sin(t) * .003;
	float si = sin(t * 0.1); // ...Squiffy rotation matrix!
	float co = cos(t * 0.9);
	uv *= mat2(co, si, -si, co);
	vec3 col = vec3(0.0);
	vec3 init = vec3(0.15, 0.15 + sin(time * 0.001) * .01, time * 0.0008);
	for (int r = 0; r < 70; r++){
		vec3 p = init + s * vec3(uv, 0.134);
		p.z = mod(p.z, 2.0);
		for (int i=0; i < 10; i++)
      p = abs(p * 2.03) / dot(p, p) - 0.75;
		v += length(p * p) * smoothstep(0.0, 0.25, 0.75 - s) * .001;
		col +=  vec3(v * 0.5, 1.0 - s * 0.5, 1.2 + v * 0.4) * v * 0.011;
		s += .01;
	}
	fragColor = vec4(col, 1.0);
}
</script>
